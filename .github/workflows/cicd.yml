# Nombre que se ve en la pestaña Actions
name: Angular CI/CD

# on: CUÁNDO se ejecuta el workflow.
#  - pull_request contra main -> CI (compila y prueba antes de fusionar)
#  - push a main              -> CI + CD (tras fusionar, se despliega)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Solo un despliegue a la vez; no cancela uno en curso a medias.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------- CI: se ejecuta en PR y en push ----------
  build:
    runs-on: ubuntu-latest
    # permissions: mínimos necesarios (solo leer el repo)
    permissions:
      contents: read
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Node 22 con caché de npm
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci: instala exactamente lo que dice package-lock.json
      - name: Instalar dependencias
        run: npm ci

      # EXTENSIÓN: tests antes del build, sin modo interactivo.
      # Los umbrales de cobertura (80/80/80 y 70 ramas) están en angular.json;
      # si no se alcanzan o un test falla, este paso falla y la PR queda bloqueada.
      - name: Tests con cobertura
        run: npx ng test --no-watch

      - name: Subir informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

      # Si hay un error de compilación, este paso (y el job) falla
      - name: Compilar Angular
        run: npx ng build --base-href /cicd-angular/

      # if: solo en push (en una PR no se publica nada)
      - name: Subir artefacto de Pages
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/cicd-angular/browser

  # ---------- CD: solo en push a main ----------
  deploy:
    # needs: espera a que build termine correctamente
    needs: build
    # if: nunca se despliega desde una PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # permissions: lo mínimo que exige GitHub Pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
